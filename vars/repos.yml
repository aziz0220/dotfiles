repositories:
  # nvim is deliberately NOT cloned here. The vault carries ~/.config/nvim
  # (the user's kickstart config), and the restore places it. Cloning vanilla
  # kickstart over the same path deleted the restored config -- validate_setup
  # caught files like lazy-lock.json missing as a result.
  - name: ".nvm"
    path: "{{ user_home }}/.nvm"
    clone_from: "https://github.com/nvm-sh/nvm.git"
    clone_if_missing: true
    remotes:
      origin: "https://github.com/nvm-sh/nvm.git"
  - name: "lazy.nvim"
    path: "{{ user_home }}/.local/share/nvim/lazy/lazy.nvim"
    clone_from: "https://github.com/folke/lazy.nvim.git"
    clone_if_missing: true
    remotes:
      origin: "https://github.com/folke/lazy.nvim.git"
