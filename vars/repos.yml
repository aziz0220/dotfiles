# Personal project repositories are deliberately NOT tracked here. Cloning,
# pushing and pulling your own work is your responsibility, not the
# provisioner's -- it cannot know about unpushed commits or local-only
# directories. Only tooling required for the shell and editor to function
# is cloned above. See scripts/validate_setup.sh, which warns about
# unpushed or uncommitted work before you rebuild a machine.
