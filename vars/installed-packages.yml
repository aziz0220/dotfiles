# Curated apt essentials -- NOT a machine snapshot.
#
# This list is deliberately small and hand-maintained: it names the packages a
# provisioned machine needs regardless of which image it started from. It used
# to hold a raw `dpkg-query` dump (1,650 packages) which mirrored every base
# image library, font, and upgrade leftover onto new machines -- much of which
# does not even exist on other Ubuntu releases. New machines get a clean Ubuntu
# base plus exactly this.
#
# Anything that installs through its own channel lives elsewhere:
#   custom-tools.yml -> claude, opencode, junie, copilot, rustup, neovim,
#                       clangd, kind, docker, cloudflared, tailscale, stripe
#   npm-global.yml   -> vercel, railway, codex, cloc, cm, olcli
#   snap-list.yml    -> aws-cli
#   pip-user.yml     -> uv, jupyter, playwright, git-filter-repo, kaggle
#
# To add a package, add one line here; to remove one, delete the line.
packages:
  - build-essential
  - gcc
  - g++
  - make
  - cmake
  - pkg-config
  - autoconf
  - automake
  - libssl-dev
  - libffi-dev
  - zlib1g-dev
  - git
  - git-lfs
  - gh
  - zsh
  - tmux
  - htop
  - ripgrep
  - jq
  - xclip
  - tree
  - unzip
  - zip
  - curl
  - wget
  - rsync
  - ncdu
  - python3
  - python3-dev
  - python3-pip
  - python3-venv
  - openssh-server
  - openssh-client
  - ca-certificates
  - dnsutils
  - yamllint
  - shellcheck
  - rclone
  - ffmpeg
