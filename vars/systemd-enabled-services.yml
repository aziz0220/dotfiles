wsl_instance_name: >-
  {{ lookup('env', 'WSL_DISTRO_NAME')
     | default(ansible_facts.distribution ~ '-' ~ ansible_facts.distribution_version, true) }}
wsl_instance_port_offset: "{{ ((wsl_instance_name | hash('sha1'))[0:4] | int(base=16)) % 10000 }}"
wsl_ssh_port: "{{ 20000 + (wsl_instance_port_offset | int) }}"
wsl_ttyd_port: "{{ 30000 + (wsl_instance_port_offset | int) }}"

systemd_services:
  - apparmor.service
  - apt-daily-upgrade.timer
  - apt-daily.timer
  - console-setup.service
  - cron.service
  - dbus-org.freedesktop.resolve1.service
  - dbus-org.freedesktop.timesync1.service
  - dpkg-db-backup.timer
  - e2scrub_all.timer
  - fstrim.timer
  # getty@tty1.service is deliberately absent. It was captured from a headless
  # WSL host, where it is enabled. Applying it with state: started on a desktop
  # evicts the GUI: gdm3.service declares Conflicts=getty@tty1.service, so
  # starting the getty makes systemd stop GDM, dropping the user to a text
  # login on tty1 mid-provision. systemd allocates TTYs on demand via
  # getty.target and autovt@; nothing here needs to force one.
  - irqbalance.service
  - keyboard-setup.service
  - logrotate.timer
  - man-db.timer
  - networkd-dispatcher.service
  - remote-fs.target
  - rsyslog.service
  - snapd.apparmor.service
  - snapd.seeded.service
  - snapd.service
  - snapd.socket
  - sudo.service
  - syslog.service
  - systemd-pstore.service
  - systemd-resolved.service
  - systemd-timesyncd.service
  - ufw.service
  - unattended-upgrades.service
  - uuidd.socket
