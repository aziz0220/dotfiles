---
# Supplemental groups the target user must belong to.
#
# Names only, deliberately. GIDs are machine-specific: pinning them meant a
# captured `docker` gid could collide with the primary group of a user whose
# uid differs from the capturing machine's, which failed group creation and
# then broke user creation entirely. Membership is what matters here; the
# system assigns whatever gid is free.
user_groups:
  - adm
  - audio
  - cdrom
  - dialout
  - dip
  - docker
  - floppy
  - netdev
  - plugdev
  - sudo
  - video
